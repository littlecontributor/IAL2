# =============================================================================
# IA Locale — configuration principale
# =============================================================================

ui:
  host: "127.0.0.1"
  port: 7860
  title: "IA Locale — Assistant privé"
  theme: "midnight"
  analytics: false

llm:
  provider: "ollama"
  host: "http://127.0.0.1:11434"
  default_model: "qwen3.5:9b"
  # Shortlist maintenue dans scripts/model_catalog.py ; seules les variantes
  # installées apparaissent dans le sélecteur du chat.
  models:
    - "qwen3.8:27b"
    - "qwen3.5:9b"
    - "gemma4:12b"
    - "gpt-oss:20b"
    - "deepseek-r1:8b"
    - "qwen3.5:4b"
    - "qwen2.5-coder:7b"
    - "qwen3-coder:30b"
  temperature: 0.7
  max_tokens: 2048

stt:
  provider: "faster-whisper"
  model: "base"
  language: "fr"
  device: "cpu"
  compute_type: "int8"

tts:
  provider: "piper"
  piper:
    model_dir: "models/piper"
    voice: "fr_FR-siwis-medium"
  coqui:
    model: "tts_models/fr/mai/tacotron2-DDC"
  speed: 1.0

rag:
  provider: "chromadb"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 1000
  chunk_overlap: 200
  persist_dir: "chroma_db"

images:
  provider: "diffusers"
  model: "stabilityai/stable-diffusion-2-1-base"
  device: "cpu"
  steps: 20
  guidance: 7.5

audio:
  sample_rate: 22050
  effects_enabled: true
  default_theme: "minimal"

system:
  auto_clean: false
  clean_interval_hours: 24
  max_temp_files: 100
  monitoring: true

personalities:
  default: "assistant"
  dir: "config/personalities"

paths:
  models: "models"
  outputs: "outputs"
  sounds: "sounds"
  chroma_db: "chroma_db"
